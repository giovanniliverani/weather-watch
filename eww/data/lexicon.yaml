    weak:
      en: ["heavy rain", "heavy rains", "torrential rain", "torrential rains", monsoon, downpour, downpours, "rising waters"]
      it: ["piogge torrenziali", "pioggia torrenziale", "forti piogge", "piogge intense", "ondata di maltempo"]
