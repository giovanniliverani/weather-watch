# Extreme Weather Watch: the hazard lexicon (M3, docs/architecture.md §4). English and Italian.
#
# eww.extract matches every pattern case-insensitively on word boundaries against a document's title and
# excerpt (diacritics folded, so "siccità" and "siccita" both match). A `strong` term names the hazard on
# its own; a `weak` term only counts when nothing stronger is found and yields a low confidence. A
# `negative` pattern vetoes any hit it overlaps: "flood of complaints" is not a flood, "storm of criticism"
# is not a storm. `query` lists the terms the GDELT collector puts in the hazard part of its query
# (kept short: GDELT rejects long queries). Add a language by adding a key under strong/weak/query;
# the extractor reads every key it finds.
version: 1

