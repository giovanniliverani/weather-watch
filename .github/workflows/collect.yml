# Spine collector: the same `eww collect` the laptop runs, executed every three hours by GitHub
# Actions, with the raw snapshots and the run log committed to the orphan `data` branch.
#
# Facts recorded in docs/architecture.md §1 and §4 (checked against the GitHub Actions docs on 2026-09-16):
#   * scheduled workflows run from the default branch only, and runs can be delayed under load;
#     the docs advise against the top of the hour, hence minute 7;
#   * pushes made with the default GITHUB_TOKEN do not trigger other workflows, so committing to
#     `data` cannot start this workflow again;
#   * no secrets: GITHUB_TOKEN with `contents: write` is enough to push to this repository.
name: collect

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main (the collector code)
        uses: actions/checkout@v5

      # Only runs/ is materialised: snapshots are append-only, so their history need not be on disk.
      # New snapshot files are added with `git add --sparse` below and stay in the branch's tree.
      - name: Check out the data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch
          sparse-checkout: |
            runs
          sparse-checkout-cone-mode: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen --no-dev

      # Exit code 1 only when every source failed; the run log is written either way.
      - name: Collect
        id: collect
        run: |
          set -o pipefail
          uv run eww collect --all-spine --out data-branch | tee collect.log
          summary=$(awk '/^collect summary:/ { sub(/^collect summary: /, ""); print }' collect.log)
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"

      - name: Commit and push the snapshots
        working-directory: data-branch
        env:
          SUMMARY: ${{ steps.collect.outputs.summary }}
        run: |
          git config user.name "eww-collector[bot]"
          git config user.email "eww-collector[bot]@users.noreply.github.com"
          git add --sparse -A
          if ! git diff --cached --name-only | grep -v '^runs/' | grep -q . ; then
            echo "no new snapshot files; nothing committed"
            exit 0
          fi
          git commit --quiet -m "collect $(date -u +%Y-%m-%dT%H:%M:%SZ): ${SUMMARY}"
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:data; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/data"
            git pull --rebase --quiet origin data
          done
          echo "push failed after 3 attempts" >&2
          exit 1
