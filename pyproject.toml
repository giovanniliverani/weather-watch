[project]
name = "eww"
version = "0.1.0"
description = "Extreme Weather Watch: recent extreme weather and natural-hazard events on a local map."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "python-ulid>=3.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "folium>=0.19",
    "streamlit-folium>=0.24",
]

[project.scripts]
eww = "eww.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eww"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
