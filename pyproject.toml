[project]
name = "eww"
version = "0.1.0"
description = "Extreme Weather Watch: recent extreme weather and natural-hazard events on a local map."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "python-ulid>=3.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "folium>=0.19",
    "streamlit-folium>=0.24",
    "pyyaml>=6",
    "numpy>=2",
]

[project.scripts]
eww = "eww.cli:app"

[dependency-groups]
dev = ["pytest>=8"]
# Laptop-only enrichment (M3): the embedding model, spaCy and its two NER models. GitHub Actions runs
# `uv sync --frozen --no-dev`, which leaves this group out, so the spine collector stays light.
enrich = [
    "sentence-transformers>=3",
    "spacy>=3.8,<3.9",
    "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eww"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
